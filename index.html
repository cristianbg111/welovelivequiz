<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0811">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="WE LOVE LIVE · Accede a WE LOVE LIVE MUSIC, WE LOVE LIVE VIDEOS y AgendaWeLove desde un único lugar.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>WE LOVE LIVE · Música y espectáculo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b0811'/%3E%3Cpath d='M10 18 19 47 31 27 43 47 54 18' fill='none' stroke='%23ff168d' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root{
      color-scheme:dark;
      --bg:#08080e;--panel:#11101a;--panel-2:#1a1423;
      --pink:#ff168d;--yellow:#ffcd34;--cyan:#39dafa;
      --white:#fff9ff;--muted:#b9b4ca;--line:rgba(255,255,255,.15);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html{min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
    body{min-height:100vh;min-height:100dvh;margin:0;background:var(--bg);color:var(--white);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
    body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse 50% 42% at 20% 17%,rgba(255,0,137,.19),transparent 80%),radial-gradient(ellipse 46% 34% at 85% 33%,rgba(43,188,243,.12),transparent 85%),linear-gradient(165deg,#0c0814 0%,#09090e 55%,#10101a 100%)}
    body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.36),transparent 83%)}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    :focus-visible{outline:3px solid var(--yellow);outline-offset:5px}
    .page{max-width:1120px;margin:0 auto;padding:22px clamp(17px,4.5vw,46px) max(30px,env(safe-area-inset-bottom))}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:14px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brandmark{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;border-radius:13px;font-weight:950;font-style:italic;font-size:27px;line-height:1;background:linear-gradient(145deg,var(--pink),#a90092);box-shadow:0 7px 27px rgba(255,22,141,.24)}
    .brandcopy strong{display:block;font-size:14px;letter-spacing:.16em;white-space:nowrap}
    .brandcopy span{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em;margin-top:4px}
    .top-pill{border:1px solid rgba(255,205,52,.35);background:rgba(255,205,52,.07);color:var(--yellow);border-radius:100px;padding:9px 13px;font-size:10px;font-weight:850;letter-spacing:.15em;white-space:nowrap}
    .hero{text-align:center;padding:clamp(20px,4.4vw,56px) 0 20px}
    .overline{display:inline-flex;gap:9px;align-items:center;color:var(--yellow);font-weight:850;font-size:11px;letter-spacing:.23em}
    .overline .spark{color:var(--pink);font-size:18px}
    .hero h1{font-size:clamp(30px,5.7vw,61px);line-height:1.05;font-weight:950;letter-spacing:-.045em;margin:15px auto 16px;max-width:1000px}
    .hero h1 em{display:block;font-style:normal;background:linear-gradient(100deg,#ff8dd5 7%,var(--pink) 45%,var(--yellow) 91%);background-clip:text;-webkit-background-clip:text;color:transparent}
    .lead{color:var(--muted);font-size:clamp(14px,1.7vw,18px);line-height:1.6;margin:0 auto;max-width:640px}
    .logo-wrap{position:relative;max-width:760px;margin:24px auto 33px;padding:8px;border-radius:20px;overflow:hidden;background:linear-gradient(125deg,rgba(255,22,141,.48),rgba(25,31,53,.6) 40%,rgba(255,205,52,.32));box-shadow:0 23px 75px rgba(0,0,0,.28),0 0 55px rgba(231,0,148,.13)}
    .logo-wrap img{display:block;width:100%;height:auto;border-radius:13px;object-fit:cover;aspect-ratio:2048/1278}
    .destinations-title{text-align:center;color:var(--yellow);font-size:12px;letter-spacing:.21em;font-weight:900;margin:0 0 20px}
    .destinations{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
    .destination{position:relative;display:flex;flex-direction:column;align-items:stretch;min-height:272px;padding:25px 24px 23px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(156deg,rgba(255,255,255,.065),rgba(255,255,255,.008) 54%),#14111c;isolation:isolate;overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
    .destination:before{content:"";position:absolute;z-index:-1;width:240px;height:240px;right:-90px;top:-115px;border-radius:50%;filter:blur(24px);opacity:.25;background:var(--pink)}
    .destination.videos:before{background:var(--cyan)}
    .destination.agenda:before{background:var(--yellow)}
    .destination:hover{transform:translateY(-4px);box-shadow:0 19px 48px rgba(0,0,0,.22);border-color:rgba(255,255,255,.32)}
    .destination:active{transform:translateY(-1px)}
    .destination .head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .app-icon{width:59px;height:59px;flex:0 0 59px;display:grid;place-items:center;border-radius:17px;border:1px solid rgba(255,255,255,.22);color:white;background:linear-gradient(135deg,#ff198b,#a70091);box-shadow:0 9px 26px rgba(255,24,144,.22)}
    .videos .app-icon{background:linear-gradient(135deg,#16cbe7,#3d62da);box-shadow:0 9px 26px rgba(56,183,240,.17)}
    .agenda .app-icon{background:linear-gradient(135deg,#f9d64f,#e36b25);box-shadow:0 9px 26px rgba(255,205,52,.16);color:#25101b}
    .app-icon svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tag{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.20);border-radius:100px;padding:7px 10px;color:#f9c9e6;background:rgba(255,22,141,.10);font-size:10px;letter-spacing:.07em;font-weight:800;white-space:nowrap}
    .videos .tag{color:#b4ebff;background:rgba(55,200,244,.08)}
    .agenda .tag{color:#ffdf79;background:rgba(255,205,52,.08)}
    .destination h2{font-size:clamp(21px,2.6vw,28px);font-weight:900;letter-spacing:-.025em;line-height:1.12;margin:22px 0 8px}
    .destination p{margin:0;color:#c5c1d1;line-height:1.5;font-size:14px;max-width:36ch}
    .visit{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:21px;font-weight:850;font-size:13px;letter-spacing:.025em;color:white}
    .visit span{display:inline-flex;justify-content:center;align-items:center;min-height:42px;border-radius:12px;padding:0 15px;background:var(--pink);color:#fff}
    .videos .visit span{background:var(--cyan);color:#031724}
    .agenda .visit span{background:var(--yellow);color:#201323}
    .visit svg{width:23px;height:23px;transition:transform .18s}
    .destination:hover .visit svg{transform:translateX(4px)}
    .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-top:32px;padding:19px 0 4px;border-top:1px solid rgba(255,255,255,.12)}
    .copyright{font-size:11px;color:#a9a5ba;line-height:1.5}
    .wake{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:10px;max-width:100%;color:#aaa4bb;font-size:11px}
    .wake-dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:#f5b948;box-shadow:0 0 0 4px rgba(245,185,72,.12)}
    .wake[data-status="on"] .wake-dot{background:#78e4bc;box-shadow:0 0 0 4px rgba(120,228,188,.12)}
    .wake[data-status="off"] .wake-dot{background:#818195;box-shadow:none}
    .wake-button{border-radius:100px;background:#241d32;border:1px solid rgba(255,255,255,.22);color:var(--white);padding:9px 13px;min-height:36px;font-size:11px;font-weight:750;cursor:pointer}
    .wake-button:hover{background:#342743}
    .wake-button[hidden],.wake[hidden]{display:none!important}
    @media(max-width:1040px) and (min-width:681px){
      .destinations{grid-template-columns:repeat(2,minmax(0,1fr))}
      .destination.agenda{grid-column:1 / -1;min-height:224px}
    }
    @media(max-width:680px){
      .page{padding-top:15px;padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
      .brandcopy strong{font-size:12px;letter-spacing:.1em}
      .brandcopy span{font-size:9px;letter-spacing:.08em}
      .top-pill{font-size:9px;padding:8px 9px;letter-spacing:.06em}
      .hero{padding-top:29px}
      .hero h1{font-size:clamp(29px,8vw,44px);margin:14px 0}
      .logo-wrap{margin:22px 0 28px;padding:5px;border-radius:15px}
      .logo-wrap img{border-radius:11px}
      .destinations{grid-template-columns:1fr;gap:12px}
      .destination.agenda{grid-column:auto}
      .destination{min-height:220px;padding:18px 19px;border-radius:18px}
      .destination h2{margin:15px 0 6px}
      .destination .app-icon{width:54px;height:54px;flex-basis:54px}
      .foot{margin-top:24px}
      .wake{justify-content:flex-start}
    }
    @media(max-width:360px){.top-pill{display:none}.page{padding-left:13px;padding-right:13px}.tag{font-size:9px}.destination{padding:17px}}

    /* Logo con ondulación de tela / bandera. La imagen original permanece como respaldo. */
    .logo-wrap{isolation:isolate}
    .logo-wrap .flag-canvas{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);border-radius:13px;pointer-events:none;opacity:0;transition:opacity .35s ease}
    .logo-wrap.flag-ready .flag-canvas{opacity:1}
    @media(max-width:680px){.logo-wrap .flag-canvas{inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:11px}}
    @media(prefers-reduced-motion:reduce){.logo-wrap .flag-canvas{display:none!important}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
    /* Estilo de la nueva tarjeta We Love Quiz. */
    .destination.quiz:before{background:#b58bff}
    .quiz .app-icon{background:linear-gradient(135deg,#ba74ff,#7144c9);box-shadow:0 9px 26px rgba(157,101,255,.2)}
    .quiz .tag{color:#e2c7ff;background:rgba(157,101,255,.1)}
    .quiz .visit span{background:#b99aff;color:#201133}
    @media(min-width:1041px){.destination.quiz{grid-column:2}}
    @media(min-width:681px) and (max-width:1040px){.destination.quiz{grid-column:1 / -1;min-height:224px}}
    /* Resplandor y destellos suaves en las tarjetas de acceso. */
    .destination{--card-rgb:255,22,141;border-color:rgba(var(--card-rgb),.32);box-shadow:0 0 0 1px rgba(var(--card-rgb),.05),0 0 22px rgba(var(--card-rgb),.14)}
    .destination.videos{--card-rgb:57,218,250}
    .destination.agenda{--card-rgb:255,205,52}
    .destination.quiz{--card-rgb:185,154,255}
    .destination:before{-webkit-animation:wll-card-glow 6.4s ease-in-out infinite;animation:wll-card-glow 6.4s ease-in-out infinite}
    .destination:after{content:"";position:absolute;top:-45%;bottom:-45%;left:-85%;width:55%;z-index:1;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);-webkit-transform:translateX(-110%) rotate(17deg);transform:translateX(-110%) rotate(17deg);-webkit-animation:wll-card-shine 9s ease-in-out infinite;animation:wll-card-shine 9s ease-in-out infinite}
    .destination .card-glint{position:absolute;z-index:2;width:14px;height:14px;opacity:0;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,.15) 27%,transparent 62%);-webkit-animation:wll-card-glint 8s ease-in-out infinite;animation:wll-card-glint 8s ease-in-out infinite}
    .destination .card-glint:before,.destination .card-glint:after{content:"";position:absolute;left:50%;top:50%;border-radius:100%;background:rgba(255,255,255,.8);-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%)}
    .destination .card-glint:before{width:1px;height:100%}
    .destination .card-glint:after{width:100%;height:1px}
    .destination .card-glint-a{right:18px;top:1px}
    .destination .card-glint-b{left:18px;bottom:1px;-webkit-animation-delay:-3.5s;animation-delay:-3.5s}
    .destination.videos:before,.destination.videos:after,.destination.videos .card-glint-a{-webkit-animation-delay:-2s;animation-delay:-2s}
    .destination.agenda:before,.destination.agenda:after,.destination.agenda .card-glint-a{-webkit-animation-delay:-4s;animation-delay:-4s}
    .destination.quiz:before,.destination.quiz:after,.destination.quiz .card-glint-a{-webkit-animation-delay:-6s;animation-delay:-6s}
    .destination.videos .card-glint-b{-webkit-animation-delay:-5.5s;animation-delay:-5.5s}
    .destination.agenda .card-glint-b{-webkit-animation-delay:-7.5s;animation-delay:-7.5s}
    .destination.quiz .card-glint-b{-webkit-animation-delay:-1.5s;animation-delay:-1.5s}
    @-webkit-keyframes wll-card-glow{0%,100%{opacity:.19;-webkit-transform:scale(.96)}50%{opacity:.48;-webkit-transform:scale(1.05)}}
    @keyframes wll-card-glow{0%,100%{opacity:.19;transform:scale(.96)}50%{opacity:.48;transform:scale(1.05)}}
    @-webkit-keyframes wll-card-shine{0%,5%{opacity:0;-webkit-transform:translateX(-110%) rotate(17deg)}10%{opacity:.75}25%{opacity:.5}30%,100%{opacity:0;-webkit-transform:translateX(520%) rotate(17deg)}}
    @keyframes wll-card-shine{0%,5%{opacity:0;transform:translateX(-110%) rotate(17deg)}10%{opacity:.75}25%{opacity:.5}30%,100%{opacity:0;transform:translateX(520%) rotate(17deg)}}
    @-webkit-keyframes wll-card-glint{0%,14%,26%,100%{opacity:0;-webkit-transform:scale(.45) rotate(0deg)}18%,21%{opacity:.9;-webkit-transform:scale(1) rotate(45deg)}}
    @keyframes wll-card-glint{0%,14%,26%,100%{opacity:0;transform:scale(.45) rotate(0deg)}18%,21%{opacity:.9;transform:scale(1) rotate(45deg)}}
    @media(hover:hover){.destination:hover{border-color:rgba(var(--card-rgb),.8);box-shadow:0 19px 48px rgba(0,0,0,.25),0 0 28px rgba(var(--card-rgb),.35)}}
    .destination:active,.destination:focus-visible{border-color:rgba(var(--card-rgb),.8);box-shadow:0 0 28px rgba(var(--card-rgb),.35)}
    @media(prefers-reduced-motion:reduce){.destination:before,.destination:after,.destination .card-glint{-webkit-animation:none!important;animation:none!important}}
    /* Acceso visual de administrador, compatible con controles táctiles. */
    .top-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex:0 0 auto}
    .admin-toggle{min-height:36px;padding:8px 13px;border:1px solid rgba(255,255,255,.24);border-radius:100px;background:#241d32;color:var(--white);font-size:11px;font-weight:800;letter-spacing:.04em;white-space:nowrap;cursor:pointer}
    .admin-toggle:hover,.admin-toggle:focus-visible{border-color:var(--yellow);background:#342743}
    .destination.is-locked{opacity:.62;-webkit-filter:grayscale(.75);filter:grayscale(.75);pointer-events:none;cursor:not-allowed}
    .destination.is-locked .visit svg{opacity:.4}
    .portal-admin-modal[hidden]{display:none!important}
    .portal-admin-modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1000;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px;background:rgba(4,3,9,.82)}
    .portal-admin-panel{position:relative;width:100%;max-width:390px;padding:26px;border:1px solid rgba(255,205,52,.35);border-radius:22px;background:#17121e;box-shadow:0 20px 70px rgba(0,0,0,.55);color:var(--white)}
    .portal-admin-panel h2{margin:0 42px 8px 0;font-size:24px;line-height:1.2}
    .portal-admin-panel p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
    .portal-admin-panel label{display:block;margin:0 0 8px;font-size:13px;font-weight:800}
    .portal-admin-input{display:block;width:100%;height:48px;padding:0 13px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:#0c0a11;color:#fff;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
    .portal-admin-input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,205,52,.16)}
    .portal-admin-error{margin:9px 0 0!important;color:#ff9aad!important;font-size:13px!important}
    .portal-admin-submit{display:block;width:100%;min-height:46px;margin-top:18px;border:0;border-radius:12px;background:var(--yellow);color:#201323;font-weight:900;cursor:pointer}
    .portal-admin-close{position:absolute;right:17px;top:15px;width:38px;height:38px;border:1px solid rgba(255,255,255,.2);border-radius:12px;background:#282030;color:white;font-size:23px;line-height:1;cursor:pointer}
    @media(max-width:520px){.top-actions{flex-direction:column-reverse;align-items:flex-end;gap:5px}.top-actions .top-pill{padding:5px 8px;font-size:8px}.admin-toggle{min-height:32px;padding:6px 11px}.portal-admin-panel{padding:22px}}
    /* Margenes seguros y controles táctiles para móviles, incluido Safari en iPhone. */
    .page{padding-top:22px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-left:17px;padding-right:17px;padding-left:clamp(17px,4.5vw,46px);padding-right:clamp(17px,4.5vw,46px);padding-bottom:30px;padding-bottom:max(30px,calc(env(safe-area-inset-bottom,0px) + 12px))}
    @supports(padding-left:max(1px,2px)){
      .page{padding-left:max(clamp(17px,4.5vw,46px),calc(env(safe-area-inset-left,0px) + 12px));padding-right:max(clamp(17px,4.5vw,46px),calc(env(safe-area-inset-right,0px) + 12px))}
    }
    @media(max-width:680px),(pointer:coarse){
      .page{padding-top:48px;padding-top:max(48px,calc(env(safe-area-inset-top,0px) + 16px))}
    }
    @media(max-width:360px){
      .page{padding-left:13px;padding-right:13px}
      @supports(padding-left:max(1px,2px)){
        .page{padding-left:max(13px,calc(env(safe-area-inset-left,0px) + 12px));padding-right:max(13px,calc(env(safe-area-inset-right,0px) + 12px))}
      }
    }
    .topbar{position:relative;z-index:10;min-width:0}
    .top-actions{position:relative;z-index:1}
    .admin-toggle{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;min-width:84px;min-height:48px;padding:10px 16px;font-size:13px;line-height:1.2;touch-action:manipulation}
    @media(max-width:320px){.topbar{gap:8px}.brand{gap:8px}.brandcopy span{font-size:8px;letter-spacing:.02em}}
    @media(max-width:280px){.topbar{flex-wrap:wrap}.top-actions{margin-left:auto}}
    .portal-admin-modal{align-items:flex-start;-webkit-overflow-scrolling:touch;padding-top:20px;padding-right:20px;padding-bottom:20px;padding-left:20px;padding-top:max(20px,calc(env(safe-area-inset-top,0px) + 12px));padding-right:max(20px,calc(env(safe-area-inset-right,0px) + 12px));padding-bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 12px));padding-left:max(20px,calc(env(safe-area-inset-left,0px) + 12px))}
    .portal-admin-panel{flex-shrink:0;margin-top:auto;margin-bottom:auto}
    .portal-admin-close{width:44px;height:44px}
    .portal-admin-panel h2{margin-right:48px}
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand" aria-label="WE LOVE LIVE">
        <div class="brandmark" aria-hidden="true">W</div>
        <div class="brandcopy"><strong>WE LOVE LIVE</strong><span>MÚSICA · VÍDEO · EXPERIENCIAS</span></div>
      </div>
      <div class="top-actions">
        <span class="top-pill">PORTAL OFICIAL</span>
        <button class="admin-toggle" id="portalAdminButton" type="button" aria-haspopup="dialog" aria-expanded="false">Admin</button>
      </div>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <div class="overline"><span class="spark" aria-hidden
